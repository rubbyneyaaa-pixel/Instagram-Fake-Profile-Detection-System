<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav>
    <div class="logo">
        AI Profile Detector
    </div>

    <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/dashboard">Dashboard</a></li>
        <li><a href="/history">History</a></li>
    </ul>
</nav>

<section class="dashboard-page">

    <div class="dashboard-box">

        <h1>Registered Users</h1>

        <form method="GET">

            <input type="text"
                   name="search"
                   placeholder="Search User"
                   value="{{ search }}">

            <button type="submit">
                Search
            </button>

        </form>

        <br>

        <table>

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Action</th>
            </tr>

            {% for user in users %}

            <tr>

                <td>{{ user[0] }}</td>
                <td>{{ user[1] }}</td>
                <td>{{ user[2] }}</td>

                <td>
                    <a href="/delete/{{ user[0] }}"
                       class="delete-btn">
                       Delete
                    </a>
                </td>

            </tr>

            {% endfor %}

        </table>

    </div>

</section>

</body>
</html>
