<!DOCTYPE html>
<html>
<head>
    <title>History</title>
</head>
<body>

<h1>Detection History</h1>

<table border="1">

<tr>
    <th>ID</th>
    <th>Username</th>
    <th>Instagram ID</th>
    <th>Result</th>
</tr>

{% for row in records %}

<tr>
    <td>{{ row[0] }}</td>
    <td>{{ row[1] }}</td>
    <td>{{ row[2] }}</td>
    <td>{{ row[3] }}</td>
</tr>

{% endfor %}

</table>

</body>
</html>
