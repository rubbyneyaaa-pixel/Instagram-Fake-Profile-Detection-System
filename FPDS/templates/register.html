<!DOCTYPE html>
<html>

<head>
    <title>Register</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav>
    <div class="logo">AI Profile Detector</div>

    <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/login">Login</a></li>
        <li><a href="/register">Register</a></li>
        <li><a href="/detection">Detection</a></li>
    </ul>
</nav>

<section class="register-page">

    <div class="register-box">

        <h1>Create Account</h1>

        <form method="POST">

            <input type="text"
                   name="name"
                   placeholder="Full Name"
                   required>

            <input type="email"
                   name="email"
                   placeholder="Email"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>

            <button type="submit">
                Register
            </button>

        </form>

        {% if message %}
        <div class="success-message">
            {{ message }}
        </div>
        {% endif %}

    </div>

</section>

</body>
</html>
